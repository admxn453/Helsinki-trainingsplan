}

    --line: #2c2c2a; --line2: #3d3d3a;
    --accent: #3987e5; --fill: #2a78d6; --fill-ink: #ffffff; --soft: #172a42;
    --c-run: #3987e5; --c-kraft: #d95926; --c-cross: #199e70; --c-tt: #898781; --c-test: #9085e9;
    --plan: #2c4565; --done: #3987e5;

    --good-bg: #12301a; --warn-bg: #352b0c; --crit-bg: #3a1717;

}

<script>
/* Plan-Datensatz: Helsinki City Marathon 2027 (Version 2, 11.11.2026)

  function readCI(form) {
    const g = (n) => { const el = form.elements[n]; if (!el) return undefined; if (el.length !== undefined && el[0] && el[0].type === 'radio') { const r = $('input[name="' + n + '"]:checked', form); return r ? Number(r.value) : undefined; } const v = String(el.value).trim().replace(',', '.'); return v === '' ? undefined : Number(v); };
    const o = { feel: g('feel'), sore: g('sore'), ill: g('ill'), pain: g('pain'), sleep: g('sleep'), hrv: g('hrv'), hr: g('hr'), tr: g('tr') };
    const rng = { sleep: [0, 14], hrv: [10, 250], hr: [30, 130], tr: [0, 100] };
    Object.keys(o).forEach((k) => { if (o[k] === undefined || !isFinite(o[k]) || (rng[k] && (o[k] < rng[k][0] || o[k] > rng[k][1]))) delete o[k]; });
    return o;
  }

  // ---------- Hauptansicht ----------
  function view() { return UI.tab === 'heute' ? viewHeute() : UI.tab === 'plan' ? viewPlan() : UI.tab === 'scores' ? viewScores() : viewDaten(); }
  function focusKey() {
    const a = document.activeElement; if (!a || a === document.body || !a.getAttribute) return null;
    const k = ['data-a', 'data-id', 'data-v', 'data-d', 'data-k', 'data-i'].map((n) => [n, a.getAttribute(n)]).filter((x) => x[1] !== null);
    return k.length && k[0][0] === 'data-a' ? k : null;
  }
  function render() {
    const y = window.scrollY, fk_ = focusKey();
    renderTop();
    $('#main').innerHTML = view();
    renderTabs();
    U.wire($('#main'));
    window.scrollTo(0, y);
    if (fk_) {   // Fokus nach dem Neuaufbau zurückgeben (Tastatur und Screenreader)
      const sel = fk_.map((x) => '[' + x[0] + '="' + String(x[1]).replace(/"/g, '\\"') + '"]').join('');
      const n = document.querySelector('#main ' + sel) || document.querySelector('#tabs ' + sel);
      if (n && n.focus) { try { n.focus({ preventScroll: true }); } catch (e) { /* egal */ } }
    }
  }
  function go(tab) {
    UI.tab = tab; try { if (location.hash !== '#' + tab) location.hash = tab; } catch (e) { /* egal */ }
    render(); window.scrollTo(0, 0);
  }

  // ---------- Aktionen ----------
  function recFor(s) {
    if (s.date !== T()) return null;
    const rd = L.readinessFor(S, s.date); if (!rd) return null;
    const rec = L.recommend(s, rd); return rec ? { rec, rd } : null;
  }
  const A = {
    tab(el) { go(el.getAttribute('data-v')); },
    mode(el) { UI.mode = el.getAttribute('data-v'); render(); },
    wk(el) { const inf = L.info(T()); const cur = UI.w || (inf.phase === 'before' ? 1 : inf.phase === 'after' ? 25 : inf.w); UI.w = Math.max(1, Math.min(25, cur + Number(el.getAttribute('data-d')))); UI.sel = null; render(); },
    month(el) { UI.month = el.getAttribute('data-v'); render(); },
    day(el) { const d = el.getAttribute('data-d'); UI.mode = 'woche'; UI.w = P.weekOf(d); UI.sel = d; render(); const n = document.getElementById('day-' + d); if (n) n.scrollIntoView({ block: 'start' }); },
    goweek(el) { UI.tab = 'plan'; UI.mode = 'woche'; UI.w = Number(el.getAttribute('data-w')); UI.sel = null; render(); window.scrollTo(0, 0); },
    open(el) { const id = el.getAttribute('data-id'); UI.open[id] = !UI.open[id]; render(); },
    toggle(el) {
      const id = el.getAttribute('data-id'), s = P.byId[id], e = S.done[id];

      else {
        const c = recFor(s);

        else S.done[id] = { s: 'done', t: Date.now() };
      }
      touch(); render();
    },
    variant(el) { S.ad[el.getAttribute('data-id')] = el.getAttribute('data-v'); touch(); render(); },
    more(el) { sheetSess(el.getAttribute('data-id')); },
    checkin(el) { sheetCheckin(el.getAttribute('data-d')); },
    extra(el) { sheetExtra(el.getAttribute('data-d')); },
    'extra-del'(el) { S.extras.splice(Number(el.getAttribute('data-i')), 1); touch(); render(); },
    'sess-clear'(el) { delete S.done[el.getAttribute('data-id')]; touch(); closeSheet(); render(); },
    'sheet-close'() { closeSheet(); },
    sick(el) {
      const d = el.getAttribute('data-d'), fl = S.flags[d] = S.flags[d] || {}; fl.sick = !fl.sick;
      (P.byDate[d] || []).forEach((s) => { const e = S.done[s.id]; if (fl.sick) { if (!e || e.s === 'skip') S.done[s.id] = { s: 'exc', src: 'sick', t: Date.now() }; } else if (e && e.src === 'sick') delete S.done[s.id]; });
      touch(); render();
    },
    play(el) { const d = el.getAttribute('data-d'), fl = S.flags[d] = S.flags[d] || {}; fl.play = !fl.play; touch(); render(); },
    expl(el) { const k = el.getAttribute('data-k'); UI.expl[k] = !UI.expl[k]; render(); },
    'chart-table'(el) { const box = el.parentNode.querySelector('.chart-table'); box.hidden = !box.hidden; el.textContent = box.hidden ? 'Als Tabelle anzeigen' : 'Tabelle ausblenden'; },
    'test-save'(el) {
      const id = el.getAttribute('data-id'), s = P.byId[id], key = s.sub === 'test10' ? 'k10' : 'hm';
      const sec = L.parseDur($('#tr-' + id).value, key === 'hm' ? 'hm' : 'ms');
      if (!sec || sec < 600) { toast('Zeit nicht lesbar. Beispiel: ' + (key === 'k10' ? '39:48' : '1:36:20')); return; }
      S.tests[key] = { s: sec, d: s.date };
      if (!S.done[id] || S.done[id].s !== 'done') S.done[id] = { s: 'done', t: Date.now() };
      touch(); toast('Ergebnis gespeichert: ' + L.fmtDur(sec)); render();
    },
    gate(el) { S.gates[el.getAttribute('data-id')] = el.getAttribute('data-v'); touch(); render(); },
    theme(el) { const t = el.value; UI.theme = t; try { localStorage.setItem(LS_THEME, t); } catch (e) { /* egal */ } applyTheme(t); },
    'imp-paste'() { const v = $('#paste').value; if (!v.trim()) { toast('Kein Text eingefügt.'); return; } prepareImport([{ name: 'Eingefügter Text', text: v }]); },
    'imp-cancel'() { UI.imp = null; render(); },
    'imp-apply'() {
      const imp = UI.imp; if (!imp) return;
      const acc = { proposals: imp.match.proposals.filter((p, i) => imp.sel[i] !== false), extras: imp.match.extras };
      L.applyImport(S, imp, acc);
      imp.acts.forEach((a) => { if (a.t === 'tt' && (a.min || 0) >= 120 && P.dow(a.d) === 6) { S.flags[a.d] = Object.assign({}, S.flags[a.d], { play: true }); } });
      S.imp.push({ t: Date.now(), n: acc.proposals.length }); if (S.imp.length > 20) S.imp.shift();
      const ns = Object.keys(imp.sleep).length, nh = Object.keys(imp.health).length;
      UI.imp = null; touch(); render(); toast('Import übernommen: ' + [acc.proposals.length ? acc.proposals.length + ' Einheiten zugeordnet' : '', ns ? ns + ' Nächte' : '', nh ? nh + ' Tage Health' : ''].filter(Boolean).join(', '));
    },
    'base-recalc'() { const nb = L.recomputeBase(S, T()); if (nb) { S.base = nb; touch(); render(); toast('Basis neu berechnet'); } },
    async export() {
      const data = JSON.stringify(S), name = 'helsinki-plan-backup-' + T() + '.json';
      try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (dl) { await dl.save({ filename: name, data }); toast('Backup gespeichert'); return; } } catch (e) { if (e && e.code === 'declined') return; }
      UI.exportText = data; render();
    },
    'copy-exp'() { const ta = $('#exp'); ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => toast('Kopiert'), () => toast('Text markiert, bitte von Hand kopieren')); } catch (e) { toast('Text markiert, bitte von Hand kopieren'); } },
    'restore-open'() { UI.restore = !UI.restore; render(); },
    'restore-do'() {
      let o; try { o = JSON.parse($('#rst').value); } catch (e) { toast('Das ist kein gültiges Backup.'); return; }
      if (!o || typeof o !== 'object' || !o.done || typeof o.done !== 'object') { toast('Das ist kein gültiges Backup.'); return; }
      S = hydrate(o); UI.restore = false; touch(); render(); toast('Backup eingelesen');
    },
    'reset-open'() { UI.reset = !UI.reset; render(); },
    'reset-do'() { S = L.newState(); UI.reset = false; UI.open = {}; touch(); render(); toast('Alles gelöscht'); }
  };
  function prepareImport(files) {
    const imp = L.readFiles(files);
    const key = (a) => [a.d, a.t, a.km, a.min].join('|'), have = {}; S.acts.forEach((a) => { have[key(a)] = 1; });
    const all = S.acts.concat(imp.acts.filter((a) => !have[key(a)]));
    const m = L.matchActs(S, all, T());
    m.proposals = m.proposals.filter((p) => { const e = S.done[p.id]; return !(e && e.src === 'garmin' && e.s === p.st && e.km === p.km); });
    imp.match = m; imp.sel = {}; UI.imp = imp; render();
    const n = $('#fi'); if (n) n.scrollIntoView({ block: 'center' });
  }
  const F = {
    ci(form) {
      const o = readCI(form), d = form.getAttribute('data-d');
      if (!Object.keys(o).length) { toast('Bitte mindestens einen Wert wählen.'); return; }
      S.ci[d] = o; touch(); closeSheet(); render();
    },
    sess(form) {
      const id = form.getAttribute('data-id'), s = P.byId[id], g = (n) => { const el = form.elements[n]; if (!el) return undefined; const v = String(el.value).trim().replace(',', '.'); return v === '' ? undefined : Number(v); };
      const st = $('input[name="st"]:checked', form).value, e = { s: st, t: Date.now() };
      const km = g('km'), min = g('min'), hr = g('hr'), rpe = g('rpe');
      if (s.cat === 'run' && km > 0 && km < 100) e.km = km; if (min > 0 && min < 1000) e.min = min; if (hr > 30 && hr < 230) e.hr = hr; if (rpe >= 1 && rpe <= 10) e.rpe = rpe;
      const note = String(form.elements.note.value || '').trim(); if (note) e.note = note.slice(0, 120);
      if (S.done[id] && S.done[id].src === 'garmin') e.src = 'garmin';
      S.done[id] = e; touch(); closeSheet(); render();
    },
    extra(form) {
      const d = form.getAttribute('data-d'), g = (n) => { const v = String(form.elements[n].value).trim().replace(',', '.'); return v === '' ? undefined : Number(v); };
      const type = $('input[name="type"]:checked', form).value, e = { d, type, src: 'manual' }, km = g('km'), min = g('min');
      if (km > 0 && km < 100) e.km = km; if (min > 0 && min < 1000) e.min = min;
      const note = String(form.elements.note.value || '').trim(); if (note) e.note = note;
      S.extras.push(e); touch(); closeSheet(); render();
    },
    tests(form) {
      const parse = (n, kind) => { const v = String(form.elements[n].value).trim(); if (!v) return null; const s = L.parseDur(v, kind); return s && s >= 600 ? s : false; };
      const k5 = parse('k5', 'ms'), k10 = parse('k10', 'ms'), hm = parse('hm', 'hm');
      if (k5 === false || k10 === false || hm === false) { toast('Eine Zeit ist nicht lesbar.'); return; }
      const set = (k, v) => { if (v) S.tests[k] = { s: v, d: (S.tests[k] && S.tests[k].s === v) ? S.tests[k].d : T() }; else delete S.tests[k]; };
      set('k5', k5); set('k10', k10); set('hm', hm); touch(); render(); toast('Zeiten gespeichert');
    },
    marks(form) {
      const g = (n) => { const v = String(form.elements[n].value).trim().replace(',', '.'); const x = v === '' ? undefined : Number(v); return x !== undefined && isFinite(x) && x >= 0 ? x : undefined; };
      const m = { d: T(), pull: g('pull'), push: g('push'), bench: g('bench'), benchReps: g('benchReps'), kg: g('kg') };
      Object.keys(m).forEach((k) => m[k] === undefined && delete m[k]);
      if (Object.keys(m).length < 2) { toast('Bitte mindestens einen Wert eintragen.'); return; }
      S.marks.push(m); if (S.marks.length > 60) S.marks.shift(); touch(); render(); toast('Eingetragen');
    }
  };

  // ---------- Ereignisse ----------
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest ? ev.target.closest('[data-a]') : null;
    if (el && el.tagName !== 'INPUT') { const f = A[el.getAttribute('data-a')]; if (f) f(el, ev); return; }
    if (ev.target.id === 'sheet') closeSheet();
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'fi' && t.files && t.files.length) { Promise.all(Array.from(t.files).map((f) => f.text().then((text) => ({ name: f.name, text })))).then(prepareImport); t.value = ''; return; }
    if (t.matches && t.matches('input[data-imp]')) { if (UI.imp) UI.imp.sel[t.getAttribute('data-imp')] = t.checked; return; }
    if (t.matches && t.matches('input[data-a="theme"]')) A.theme(t);
  });
  document.addEventListener('input', (ev) => { const f = ev.target.closest ? ev.target.closest('#f-ci') : null; if (f) ciPreview(f); });
  document.addEventListener('submit', (ev) => { const f = ev.target.closest ? ev.target.closest('form[data-f]') : null; if (f) { ev.preventDefault(); F[f.getAttribute('data-f')](f); } });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
    const t = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('[role="button"][data-a]')) { ev.preventDefault(); t.click(); }
  });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (TABS.some((x) => x[0] === h) && h !== UI.tab) { UI.tab = h; render(); } });

  // ---------- Start ----------
  function init() {
    loadTheme();
    const loc = lsGet(); if (loc) S = hydrate(loc);
    const h = (location.hash || '').replace('#', ''); if (TABS.some((x) => x[0] === h)) UI.tab = h;
    render();
    initCloud();
    let day = T();
    setInterval(() => { if (T() !== day) { day = T(); render(); } }, 60000);
  }
  window.__app = { state: () => S, ui: () => UI, render, flush, touch };
  init();
})();

</script>


<script>
  // Installierbare PWA: App-Dateien für den Offline-Start zwischenspeichern.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch((err) => {
        console.warn("Service Worker konnte nicht registriert werden:", err);
      });
    });
  }
</script>
